      data-project-subtitle="헌혈 전 준비부터 회복과 다음 참여까지 이어지는 건강관리 서비스"
      data-project-description="헌혈은 왜 매번 어렵게 느껴질까요? 철분 부족으로 헌혈하지 못하는 경험과 내가 헌혈할 수 있을지 알 수 없는 불확실함은 참여를 망설이고 미루는 이유가 됩니다. &#10;&#10;Redy는 이러한 망설임을 줄이기 위해 방문 전 사전 자격 확인으로 자신의 상태를 점검하고 방문을 준비하도록 돕습니다. 헌혈의집을 채혈뿐 아니라 혈압과 인바디 등 간단한 건강 확인을 위해서도 들를 수 있는 일상 속 건강관리 공간으로 제안합니다. 대기부터 채혈, 회복까지 경험의 흐름을 세심하게 설계하고, 주먹운동 게임과 헌혈 기념 키링 제작으로 흥미를 더해 헌혈이 뜻밖의 즐거움으로 기억되도록 합니다. &#10;&#10;철분 부족으로 헌혈하지 못한 사람에게는 2주간 철분 관리를 돕는 ‘레디투키트’와 섭취 알림을 제공해 다음 참여를 준비하도록 도와줍니다. 헌혈이 누군가를 돕는 일인 동시에 자신을 돌보는 경험으로 남도록 하는 것. 이것이 Redy의 미션입니다."
    >
